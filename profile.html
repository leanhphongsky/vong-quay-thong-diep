<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ — Vòng Quay Thông Điệp</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    body { background: var(--cream); padding-bottom: 100px; }

    .profile-hero {
      background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
      padding: 48px 20px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .profile-hero::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 40px;
      background: var(--cream);
      border-radius: 50% 50% 0 0 / 40px 40px 0 0;
    }
    .avatar {
      width: 90px; height: 90px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 14px;
      backdrop-filter: blur(8px);
    }
    .profile-name { color: white; font-size: 1.5rem; margin-bottom: 4px; }
    .profile-email { color: rgba(255,255,255,0.8); font-size: 0.875rem; }

    /* Stats cards */
    .stats-row {
      max-width: 500px;
      margin: -24px auto 0;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .stat-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      padding: 16px 10px;
      text-align: center;
    }
    .stat-num { font-family:'Playfair Display',serif; font-size:1.8rem; font-weight:700; color:var(--peach); display:block; }
    .stat-label { font-size:0.7rem; color:var(--brown-light); font-weight:600; }

    /* Badges */
    .section { max-width: 500px; margin: 32px auto 0; padding: 0 20px; }
    .section-heading { font-size:0.85rem; font-weight:800; color:var(--brown-light); letter-spacing:1px; text-transform:uppercase; margin-bottom:14px; }

    .badges-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:12px; }
    .badge-item {
      text-align:center;
      padding: 14px 8px;
      background: var(--white);
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      transition: all 0.2s;
    }
    .badge-item.earned { border-color: var(--gold); background: var(--gold-soft); }
    .badge-item.earned:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
    .badge-emoji { font-size:1.6rem; display:block; margin-bottom:6px; }
    .badge-name { font-size:0.65rem; font-weight:700; color:var(--brown-mid); }
    .badge-item:not(.earned) { opacity: 0.4; filter: grayscale(1); }

    /* Progress to next badge */
    .next-badge {
      background: var(--white);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 20px;
    }
    .next-badge-row { display:flex; align-items:center; gap:14px; }
    .next-badge-emoji { font-size:2rem; }
    .next-badge-info { flex:1; }
    .next-badge-name { font-weight:700; color:var(--brown-dark); font-size:0.9rem; margin-bottom:6px; }

    /* Settings list */
    .settings-list {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .settings-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-item:hover { background: var(--cream); }
    .settings-icon { font-size:1.3rem; width:28px; text-align:center; }
    .settings-label { flex:1; font-weight:600; font-size:0.9rem; color:var(--brown-dark); }
    .settings-arrow { color:var(--brown-light); font-size:0.9rem; }
    .settings-item.danger .settings-label { color: #E74C3C; }
    .settings-item.danger .settings-icon { filter: hue-rotate(300deg); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-icon">👤</span>
      Hồ Sơ
    </div>
    <div class="navbar-actions">
      <a href="spin.html" class="btn btn-primary btn-sm">🎡 Quay ngay</a>
    </div>
  </nav>

  <div class="page" style="padding-top:64px;">
    <!-- Profile Hero -->
    <div class="profile-hero">
      <div class="avatar" id="avatar">🌸</div>
      <h2 class="profile-name" id="profileName">—</h2>
      <p class="profile-email" id="profileEmail"></p>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-num" id="totalSpins">0</span>
        <span class="stat-label">Lần quay</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="streakCount">0</span>
        <span class="stat-label">🔥 Streak</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="uniqueCount">0</span>
        <span class="stat-label">Thông điệp</span>
      </div>
    </div>

    <!-- Next badge progress -->
    <div class="section">
      <div class="section-heading">Huy Hiệu Tiếp Theo</div>
      <div class="next-badge" id="nextBadgeBox">
        <div class="next-badge-row">
          <span class="next-badge-emoji" id="nextBadgeEmoji">🥈</span>
          <div class="next-badge-info">
            <div class="next-badge-name" id="nextBadgeName">Đang tải...</div>
            <div class="progress-bar" style="margin-top:6px;">
              <div class="progress-fill" id="nextBadgeProgress" style="width:0%"></div>
            </div>
            <div style="font-size:0.75rem;color:var(--brown-light);margin-top:4px;" id="nextBadgeLabel"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Badges -->
    <div class="section">
      <div class="section-heading">Huy Hiệu</div>
      <div class="badges-grid" id="badgesGrid"></div>
    </div>

    <!-- Settings -->
    <div class="section" style="margin-bottom:16px;">
      <div class="section-heading">Cài Đặt</div>
      <div class="settings-list">
        <div class="settings-item" onclick="alert('Tính năng nhắc nhở đang được hoàn thiện!')">
          <span class="settings-icon">🔔</span>
          <span class="settings-label">Nhắc nhở hàng ngày</span>
          <span class="settings-arrow">›</span>
        </div>
        <div class="settings-item" onclick="exportData()">
          <span class="settings-icon">📤</span>
          <span class="settings-label">Xuất dữ liệu của tôi</span>
          <span class="settings-arrow">›</span>
        </div>
        <div class="settings-item danger" onclick="confirmLogout()">
          <span class="settings-icon">🚪</span>
          <span class="settings-label">Đăng xuất</span>
          <span class="settings-arrow">›</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="spin.html">
      <span class="nav-icon">🎡</span>
      Quay
    </a>
    <a href="library.html">
      <span class="nav-icon">📚</span>
      Thư viện
    </a>
    <a href="profile.html" class="active">
      <span class="nav-icon">👤</span>
      Hồ sơ
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script>
    async function initProfile() {
      const user = await getCurrentUser();
      if (!user) {
        location.href = 'login.html';
        return;
      }

      document.getElementById('profileName').textContent = user.name || 'Người dùng';
      document.getElementById('profileEmail').textContent = user.email || 'Chế độ Khách';
      document.getElementById('avatar').textContent = (user.name || 'U')[0].toUpperCase();

      if (user.id && user.id !== 'guest') {
        await syncDataFromSupabase(user.id);
      }

      renderStatsAndBadges();
    }

    const BADGES = [
      { emoji:'🌱', name:'Mầm Non',    req: 1,  type:'spin',   desc:'Quay lần đầu tiên' },
      { emoji:'🌿', name:'Chồi Xanh',  req: 7,  type:'streak', desc:'7 ngày liên tiếp' },
      { emoji:'🌸', name:'Hoa Nở',     req: 10, type:'spin',   desc:'10 lần quay' },
      { emoji:'🌟', name:'Ngôi Sao',   req: 14, type:'streak', desc:'14 ngày liên tiếp' },
      { emoji:'🦋', name:'Bướm Bay',   req: 20, type:'unique', desc:'20 thông điệp khác nhau' },
      { emoji:'🌙', name:'Ánh Trăng',  req: 30, type:'spin',   desc:'30 lần quay' },
      { emoji:'☀️', name:'Mặt Trời',   req: 30, type:'streak', desc:'30 ngày liên tiếp' },
      { emoji:'💎', name:'Kim Cương',  req: 70, type:'unique', desc:'Thu thập đủ 70 thông điệp' },
    ];

    function getBadgeValue(badge) {
      const h = getHistory();
      const s = getStreak();
      const u = uniqueMessagesCount();
      if (badge.type === 'spin') return h.length;
      if (badge.type === 'streak') return s.count;
      if (badge.type === 'unique') return u;
      return 0;
    }

    function renderStatsAndBadges() {
      const h = getHistory();
      const s = getStreak();
      const u = uniqueMessagesCount();

      document.getElementById('totalSpins').textContent = h.length;
      document.getElementById('streakCount').textContent = s.count;
      document.getElementById('uniqueCount').textContent = u;

      const grid = document.getElementById('badgesGrid');
      grid.innerHTML = '';
      BADGES.forEach(b => {
        const val = getBadgeValue(b);
        const earned = val >= b.req;
        grid.innerHTML += `
          <div class="badge-item ${earned ? 'earned' : ''}" title="${b.desc}: ${val}/${b.req}">
            <span class="badge-emoji">${b.emoji}</span>
            <div class="badge-name">${b.name}</div>
          </div>`;
      });

      const nextBadge = BADGES.find(b => getBadgeValue(b) < b.req);
      if (nextBadge) {
        const val = getBadgeValue(nextBadge);
        document.getElementById('nextBadgeEmoji').textContent = nextBadge.emoji;
        document.getElementById('nextBadgeName').textContent = nextBadge.name + ' — ' + nextBadge.desc;
        document.getElementById('nextBadgeProgress').style.width = Math.min(val/nextBadge.req*100, 100) + '%';
        document.getElementById('nextBadgeLabel').textContent = `${val}/${nextBadge.req} — còn ${nextBadge.req - val} nữa`;
      } else {
        document.getElementById('nextBadgeBox').innerHTML = '<p style="text-align:center;color:var(--peach);font-weight:700;padding:10px;">🎉 Bạn đã mở khóa tất cả huy hiệu!</p>';
      }
    }

    async function confirmLogout() {
      if (confirm('Bạn có chắc muốn đăng xuất?')) {
        await logoutUser();
        location.href = 'index.html';
      }
    }

    function exportData() {
      const user = getUser();
      const data = { user, history: getHistory(), streak: getStreak(), exported: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'vong-quay-thong-diep-data.json';
      a.click();
    }

    initProfile();
  </script>
</body>
</html>
