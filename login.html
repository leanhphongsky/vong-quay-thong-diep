<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng Nhập — Vòng Quay Thông Điệp</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #FFFDF9 0%, #FFF3EB 55%, #FDE3D6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-lg);
      padding-top: 24px;
      padding-bottom: 24px;
    }

    .auth-box {
      background: var(--bg-card);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      border: 1.5px solid var(--border);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      animation: viewFade 0.4s ease forwards;
    }

    .auth-header {
      background: linear-gradient(135deg, var(--accent) 0%, #E6885C 50%, var(--accent-gold) 100%);
      padding: 30px 24px 22px;
      text-align: center;
      color: white;
    }

    .auth-logo {
      font-size: 2.4rem;
      margin-bottom: 6px;
      display: inline-block;
      animation: spin-gentle 18s linear infinite;
    }

    .auth-header h1 {
      font-family: 'Cinzel', serif;
      color: white;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .auth-header p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
    }

    .auth-tab {
      padding: 13px;
      text-align: center;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 3px solid transparent;
      user-select: none;
    }

    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--bg-card);
    }

    .auth-body {
      padding: 24px;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-body);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 0.9rem;
      color: var(--text-primary);
      background: var(--bg-card);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
      border: none;
      border-radius: var(--r-pill);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(212, 113, 74, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit svg,
    .btn-guest svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 113, 74, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-guest {
      width: 100%;
      height: 44px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--r-pill);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-guest:hover {
      border-color: var(--accent);
      background: var(--bg-subtle);
    }

    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      margin: 14px 0;
    }

    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider-text::before { margin-right: 10px; }
    .divider-text::after { margin-left: 10px; }

    .error-msg {
      background: #FFF0EE;
      border: 1px solid #FFCFC9;
      color: #C0392B;
      border-radius: var(--r-sm);
      padding: 10px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .terms-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 12px;
      line-height: 1.5;
    }

    .back-home {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .back-home a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Kokonut Background Paths Ribbon Canvas -->
  <div class="bg-paths-wrapper" id="bgPathsWrap" aria-hidden="true">
    <canvas id="bgPathsCanvas" class="bg-paths-canvas"></canvas>
  </div>

  <div class="auth-box">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo" style="display:flex;align-items:center;justify-content:center;color:#FDE68A;"><span class="svg-icon-xl" data-svg="astrolabe"></span></div>
      <h1>VÒNG QUAY THÔNG ĐIỆP</h1>
      <p>Trạm sạc tâm hồn & đón nhận chỉ dẫn mỗi ngày</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login" onclick="switchTab('login')">Đăng Nhập</div>
      <div class="auth-tab" data-tab="register" onclick="switchTab('register')">Đăng Ký</div>
    </div>

    <!-- Body -->
    <div class="auth-body">
      <!-- Login Form -->
      <div id="loginForm" class="auth-form active">
        <div class="error-msg" id="loginError"></div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="email@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn-submit" onclick="handleLogin()" id="loginBtn"><span class="svg-icon-sm" data-svg="compass"></span> Đăng Nhập</button>
        
        <div class="divider-text">hoặc</div>
        
        <button class="btn-guest" onclick="handleGuestLogin()">
          <span class="svg-icon-sm" data-svg="user"></span>
          <span>Trải Nghiệm Dưới Dạng Khách</span>
        </button>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="auth-form">
        <div class="error-msg" id="registerError"></div>
        <div class="form-group">
          <label>Tên của bạn</label>
          <input type="text" id="registerName" class="form-control" placeholder="Ví dụ: Bình An" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="registerEmail" class="form-control" placeholder="email@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="registerPassword" class="form-control" placeholder="Ít nhất 6 ký tự" autocomplete="new-password">
        </div>
        <button class="btn-submit" onclick="handleRegister()" id="registerBtn"><span class="svg-icon-sm" data-svg="sparkles"></span> Tạo Tài Khoản</button>
        <p class="terms-text">Đăng ký tài khoản để đồng bộ chuỗi ngày quay và ghi chú của bạn lên Cloud.</p>
      </div>

      <div class="back-home">
        <span>←</span> <a href="spin.html">Vào thẳng vòng quay</a>
      </div>
    </div>
  </div>

  <!-- CDN Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/background-paths.js"></script>
  <script>
    Icons.renderAll();
    window.initBackgroundPaths('bgPathsCanvas', {
      count: 36,
      spread: 0.9,
      angle: -8,
      speed: 0.8,
      interactive: true
    });
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
    }

    const urlTab = new URLSearchParams(location.search).get('tab');
    if (urlTab === 'register') switchTab('register');

    // Kiểm tra đăng nhập
    getCurrentUser().then(u => {
      if (u) location.href = 'spin.html';
    });

    function showError(formId, msg) {
      const el = document.getElementById(formId);
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pwd   = document.getElementById('loginPassword').value;
      if (!email || !pwd) return showError('loginError', 'Vui lòng điền đầy đủ email và mật khẩu.');

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Đang kết nối...';

      try {
        await loginWithEmail(email, pwd);
        location.href = 'spin.html';
      } catch (err) {
        showError('loginError', err.message || 'Đăng nhập không thành công.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `${Icons.get('compass', 'svg-icon-sm')} Đăng Nhập`;
      }
    }

    async function handleRegister() {
      const name  = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const pwd   = document.getElementById('registerPassword').value;
      if (!name || !email || !pwd) return showError('registerError', 'Vui lòng điền đầy đủ thông tin.');
      if (pwd.length < 6) return showError('registerError', 'Mật khẩu phải từ 6 ký tự trở lên.');

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = 'Đang khởi tạo...';

      try {
        await registerWithEmail(name, email, pwd);
        try {
          await loginWithEmail(email, pwd);
        } catch (_) {}
        location.href = 'spin.html';
      } catch (err) {
        showError('registerError', err.message || 'Tạo tài khoản thất bại.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `${Icons.get('sparkles', 'svg-icon-sm')} Tạo Tài Khoản`;
      }
    }

    function handleGuestLogin() {
      saveUser({ id: 'guest', name: 'Khách', email: '' });
      location.href = 'spin.html';
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const activeForm = document.querySelector('.auth-form.active').id;
      if (activeForm === 'loginForm') handleLogin();
      else handleRegister();
    });
  </script>
</body>
</html>
