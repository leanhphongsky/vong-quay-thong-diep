<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Vòng Quay Thông Điệp</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFE8D8 50%, #FFD9C8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Orbs */
    .orb { position:absolute; border-radius:50%; filter:blur(70px); pointer-events:none; animation:float 7s ease-in-out infinite; }
    .orb-1 { width:350px;height:350px;background:#FFD6C8;top:-100px;right:-80px; opacity:0.5; }
    .orb-2 { width:280px;height:280px;background:#FFE5B4;bottom:-80px;left:-60px; opacity:0.4; animation-delay:3s; }

    .auth-box {
      position: relative;
      z-index: 2;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      animation: scaleIn 0.5s var(--transition) forwards;
    }

    /* Header area */
    .auth-header {
      background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
      padding: 32px 32px 24px;
      text-align: center;
    }
    .auth-logo { font-size: 2.5rem; margin-bottom: 8px; }
    .auth-header h1 { color: white; font-size: 1.5rem; margin-bottom: 4px; }
    .auth-header p { color: rgba(255,255,255,0.85); font-size: 0.875rem; }

    /* Tabs */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
    }
    .auth-tab {
      padding: 14px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--brown-light);
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
    }
    .auth-tab.active {
      color: var(--peach);
      border-bottom-color: var(--peach);
      background: var(--white);
    }
    .auth-tab:hover:not(.active) { color: var(--brown-mid); }

    /* Forms */
    .auth-body { padding: 28px 32px 32px; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    /* Google btn */
    .btn-google {
      width: 100%;
      background: white;
      border: 2px solid var(--border);
      color: var(--brown-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px;
      border-radius: var(--radius-sm);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .btn-google:hover { border-color: #4285F4; box-shadow: 0 2px 12px rgba(66,133,244,0.15); }
    .btn-google img { width: 20px; height: 20px; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--peach), var(--peach-light));
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 15px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(224,122,95,0.35);
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(224,122,95,0.45); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .forgot-link {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    .forgot-link a {
      font-size: 0.8rem;
      color: var(--peach);
      font-weight: 600;
    }

    .error-msg {
      background: #FFF0EE;
      border: 1px solid #FFCFC9;
      color: #C0392B;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: none;
    }
    .error-msg.show { display: block; }

    .terms {
      text-align: center;
      font-size: 0.75rem;
      color: var(--brown-light);
      margin-top: 14px;
      line-height: 1.5;
    }

    .back-home {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--brown-light);
      font-weight: 600;
    }
    .back-home a { color: var(--peach); }

    @media (max-width: 480px) {
      .auth-body { padding: 24px 20px 28px; }
      .auth-header { padding: 24px 20px 20px; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-box">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo">🌀</div>
      <h1>Vòng Quay Thông Điệp</h1>
      <p>Mỗi ngày một thông điệp từ vũ trụ</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login" onclick="switchTab('login')">Đăng nhập</div>
      <div class="auth-tab" data-tab="register" onclick="switchTab('register')">Đăng ký</div>
    </div>

    <!-- Body -->
    <div class="auth-body">

      <!-- Login Form -->
      <div id="loginForm" class="auth-form active">
        <div class="error-msg" id="loginError"></div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="email@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="forgot-link"><a href="#">Quên mật khẩu?</a></div>
        <button class="btn-submit" onclick="handleLogin()" id="loginBtn">🎡 Đăng nhập</button>
        <div class="divider">hoặc</div>
        <button class="btn-google" onclick="handleGuestLogin()">
          <span style="font-size:1.2rem">👤</span>
          Tiếp tục không cần tài khoản (Demo)
        </button>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="auth-form">
        <div class="error-msg" id="registerError"></div>
        <div class="form-group">
          <label>Tên của bạn</label>
          <input type="text" id="registerName" class="form-control" placeholder="Ví dụ: Sunny" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="registerEmail" class="form-control" placeholder="email@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="registerPassword" class="form-control" placeholder="Ít nhất 6 ký tự" autocomplete="new-password">
        </div>
        <button class="btn-submit" onclick="handleRegister()" id="registerBtn">✨ Tạo tài khoản</button>
        <p class="terms">Bằng cách đăng ký, bạn đồng ý với điều khoản sử dụng của chúng tôi</p>
      </div>

      <div class="back-home">
        <span>←</span> <a href="index.html">Quay về trang chủ</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script>
    // Switch tabs
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
    }

    // Check URL param for tab
    const urlTab = new URLSearchParams(location.search).get('tab');
    if (urlTab === 'register') switchTab('register');

    // If already logged in
    if (getUser()) location.href = 'spin.html';

    // Simple email/password auth (stored locally — will upgrade to Supabase)
    function showError(formId, msg) {
      const el = document.getElementById(formId);
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pwd   = document.getElementById('loginPassword').value;
      if (!email || !pwd) return showError('loginError', 'Vui lòng điền đầy đủ thông tin.');

      // Check stored accounts
      const accounts = JSON.parse(localStorage.getItem('vqtd_accounts') || '[]');
      const account  = accounts.find(a => a.email === email && a.password === pwd);
      if (!account) return showError('loginError', 'Email hoặc mật khẩu không đúng.');

      saveUser({ id: account.id, name: account.name, email: account.email });
      location.href = 'spin.html';
    }

    function handleRegister() {
      const name  = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const pwd   = document.getElementById('registerPassword').value;
      if (!name || !email || !pwd) return showError('registerError', 'Vui lòng điền đầy đủ thông tin.');
      if (pwd.length < 6) return showError('registerError', 'Mật khẩu phải ít nhất 6 ký tự.');

      const accounts = JSON.parse(localStorage.getItem('vqtd_accounts') || '[]');
      if (accounts.find(a => a.email === email)) return showError('registerError', 'Email này đã được đăng ký.');

      const newUser = { id: Date.now().toString(), name, email, password: pwd };
      accounts.push(newUser);
      localStorage.setItem('vqtd_accounts', JSON.stringify(accounts));
      saveUser({ id: newUser.id, name, email });
      location.href = 'spin.html';
    }

    function handleGuestLogin() {
      saveUser({ id: 'guest', name: 'Khách', email: '' });
      location.href = 'spin.html';
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const activeForm = document.querySelector('.auth-form.active').id;
      if (activeForm === 'loginForm') handleLogin();
      else handleRegister();
    });
  </script>
</body>
</html>
